[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-paper-studio"
version = "0.1.0"
description = "End-to-end empirical economics research workflow: question -> design -> execute -> verify -> publish. Orchestrates StatsPAI + academic-research-skills + Stata reference into a five-stage pipeline. Chinese-friendly, Stata-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Econ Paper Studio Contributors" }]
keywords = [
    "econometrics", "causal-inference", "empirical-research",
    "stata", "did", "rdd", "iv", "scm", "dml",
    "academic-writing", "claude-skill", "cursor-skill",
    "chinese-economics", "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "statspai>=0.5.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vision = ["openai>=1.40.0", "pillow>=10.3.0"]
fixed-effects = ["pyfixest>=0.13.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
econ-studio = "scripts.cli:main"

[project.urls]
Homepage = "https://github.com/gaaiyun/econ-paper-studio"
Issues = "https://github.com/gaaiyun/econ-paper-studio/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
